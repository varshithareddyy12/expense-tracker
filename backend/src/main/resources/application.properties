# Application Name & Port (defaults to 8080 or PORT env var on Render)
spring.application.name=expense-tracker-backend
server.port=${PORT:8080}

# Default DataSource: Persistent File-Based H2 Database
# Keeps expenses safely stored across application restarts and page refreshes
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/expensedb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Web Console (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Logging
logging.level.com.expensetracker=INFO
logging.level.org.springframework.web=INFO

